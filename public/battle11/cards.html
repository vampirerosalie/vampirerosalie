<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Battle 11 · Reusable Station Cards</title><style>
*{box-sizing:border-box}body{margin:0;background:#291019;color:#f8e1b6;font:16px Arial,sans-serif}.toolbar{max-width:1060px;margin:auto;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.toolbar h1{margin:0;font:700 2rem Georgia,serif}.toolbar p{margin:5px 0}.toolbar button,.toolbar a{background:#e0b364;border:0;border-radius:8px;padding:10px 15px;color:#2d121b;font-weight:700;text-decoration:none;cursor:pointer}.sheet{max-width:1060px;margin:0 auto 32px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{break-inside:avoid;page-break-inside:avoid;background:#fff8e9;color:#321924;border:5px solid #8b3039;border-radius:12px;padding:14px;min-height:442px;display:flex;flex-direction:column;box-shadow:0 6px 0 #a8844a}.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:2px solid #c39a5e;padding-bottom:7px}.card-top span{font-size:.7rem;font-weight:800;letter-spacing:.14em}.card-top b{font:700 1.1rem Georgia,serif}.card h2{font:700 2rem Georgia,serif;color:#7b2b38;margin:10px 0 4px}.card h3{font:700 1.1rem Georgia,serif;margin:0 0 10px}.card-main{display:grid;grid-template-columns:1fr 1.25fr;gap:10px;align-items:center;flex:1}.card-main>img:first-child{width:100%;height:190px;object-fit:cover;border-radius:8px;border:1px solid #ad8c64}.qr{width:100%;max-width:210px;aspect-ratio:1;display:block;margin:auto;background:white;padding:8px;image-rendering:pixelated}.card-foot{text-align:center;border-top:2px solid #c39a5e;padding-top:7px;margin-top:10px}.card-foot strong{font-size:1.1rem}.code{font:700 .76rem monospace;letter-spacing:.08em;margin-top:3px}.export{font-size:.75rem;color:#7a303d;text-decoration:underline}.error{color:#ffdfb6;text-align:center}@page{size:A4;margin:10mm}@media print{body{background:white}.toolbar,.export{display:none!important}.sheet{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:5mm;margin:0}.card{min-height:125mm;border-width:3px;padding:3mm;box-shadow:none}.card-main>img:first-child{height:50mm}.qr{max-width:51mm;padding:2mm}.card h2{font-size:20pt}.card h3{font-size:12pt}.card:nth-child(4n){break-after:page}}@media(max-width:650px){.toolbar{display:block}.toolbar button{margin:10px 5px 0 0}.sheet{display:block;margin:12px}.card{margin-bottom:16px}}
</style></head><body><header class="toolbar"><div><h1>The Missing Museum Jewel</h1><p>Six permanent station cards. Print once; reuse for future classes. Joining QR is different.</p></div><div><a href="./index.html?teacher=1">Back to teacher</a> <button id="print">Print cards</button></div></header><main id="sheet" class="sheet" aria-live="polite"><p>Preparing the six cards…</p></main><script>
const sheet=document.getElementById('sheet');const choice=new URLSearchParams(location.search).get('station');document.getElementById('print').onclick=()=>print();
fetch('/api/museum/stations',{cache:'no-store'}).then(async response=>{if(!response.ok)throw Error('Could not load the permanent station codes.');return response.json()}).then(stations=>{if(!Array.isArray(stations)||stations.length!==6)throw Error('The six station cards are not available.');const selected=choice?stations.filter(station=>String(station.number)===choice):stations;if(!selected.length)throw Error('Unknown station.');sheet.replaceChildren();for(const station of selected){const card=document.createElement('article');card.className='card';const top=document.createElement('div');top.className='card-top';const brand=document.createElement('b');brand.textContent='The Missing Museum Jewel';const label=document.createElement('span');label.textContent='CASE FILE · BATTLE 11';top.append(brand,label);const heading=document.createElement('h2');heading.textContent=`STATION ${station.number} / PARAGRAPH ${station.number}`;const title=document.createElement('h3');title.textContent=station.title;const main=document.createElement('div');main.className='card-main';const art=document.createElement('img');art.src=station.image;art.alt=`Museum illustration for Station ${station.number}`;const qr=document.createElement('img');qr.className='qr';qr.src=station.qrUrl;qr.alt=`QR code for Station ${station.number}`;main.append(art,qr);const foot=document.createElement('div');foot.className='card-foot';const instruction=document.createElement('strong');instruction.textContent='Scan to enter';const code=document.createElement('div');code.className='code';code.textContent=`Camera backup code: ${station.code}`;const link=document.createElement('a');link.className='export';link.href=`?station=${station.number}`;link.textContent='Print this card only';foot.append(instruction,code,link);card.append(top,heading,title,main,foot);sheet.append(card)}document.title=choice?`Station ${choice} · Museum Jewel printable card`:'Six Museum Jewel printable station cards'}).catch(error=>{sheet.innerHTML='';const message=document.createElement('p');message.className='error';message.textContent=error.message;sheet.append(message)});
</script></body></html>
